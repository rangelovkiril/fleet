apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: rampme
  namespace: rampme
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      # GitHub attributes a commit to the app's bot account by the author
      # email alone, in the form <user-id>+<login>@users.noreply.github.com.
      # Dropping the numeric id or the "[bot]" suffix breaks that link and
      # leaves the commit showing a nameless author. Recover the id after a
      # rebootstrap with:
      #   gh api '/users/<app-slug>[bot]' --jq .id
      author:
        email: 308457385+flux-fleet-app[bot]@users.noreply.github.com
        name: flux-fleet-app
      messageTemplate: |
        chore(rampme): auto-update image tags

        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Name }}: {{ range $changes }}{{ .OldValue }} -> {{ .NewValue }}{{ end }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./apps/rampme
    strategy: Setters
