# Shared shape for both the production and stage backend Deployments. Each
# overlay patches in: the image (with its own $imagepolicy marker), how MQTT
# credentials reach the container (secretRef for production, a plain env var
# for stage since hw-sim is unauthenticated), and the PVC it mounts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rampme-backend
  namespace: rampme
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rampme-backend
  template:
    metadata:
      labels:
        app: rampme-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/rangelovkiril/rampme-backend:unset
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rampme-backend-data
